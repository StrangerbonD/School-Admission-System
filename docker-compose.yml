services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=700"]
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: SchoolAdmission.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${DATABASE_URL:-Host=db;Database=school_admission;Username=postgres;Password=postgres;Maximum Pool Size=200;Command Timeout=30;Max Auto Prepare=20;Auto Prepare Min Usages=2}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_EF_SQL_LOGGING: ${ENABLE_EF_SQL_LOGGING:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      API_URL: ${API_URL:-http://localhost:8080}
    depends_on:
      - backend

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      ConnectionStrings__Default: ${TEST_DATABASE_URL:-Host=db;Database=school_admission_test;Username=postgres;Password=postgres;Maximum Pool Size=200;Command Timeout=30;Max Auto Prepare=20;Auto Prepare Min Usages=2}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      ENABLE_EF_SQL_LOGGING: ${ENABLE_EF_SQL_LOGGING:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
